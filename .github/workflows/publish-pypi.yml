name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ============================================
  # JOB 1: Publish to PyPI (runs first)
  # ============================================
  publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi  # Should match the environment name you set in PyPI's trusted publisher config (if any)
    permissions:
      id-token: write  # Required for PyPI trusted publishing (OIDC)
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            echo "Not triggered by a version tag (ref: $GITHUB_REF) — reading version from src/matchypatchy/__init__.py instead."
            VERSION=$(grep '__version__' src/matchypatchy/__init__.py | head -1 | sed -E 's/.*__version__ *= *"([^"]+)".*/\1/')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if version already exists on PyPI
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/matchypatchy/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists on PyPI — will skip build/upload."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION not found on PyPI — will build and publish."
          fi

      - name: Install build tools
        if: steps.check.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution
        if: steps.check.outputs.exists != 'true'
        run: python -m build

      - name: Check distribution
        if: steps.check.outputs.exists != 'true'
        run: twine check dist/*

      - name: Publish to PyPI
        if: steps.check.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password/token needed — uses OIDC trusted publishing

      - name: Wait for PyPI index to update
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Waiting for matchypatchy==$VERSION to become available on PyPI..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Cache-Control: no-cache" \
              "https://pypi.org/pypi/matchypatchy/$VERSION/json")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Version $VERSION is live on PyPI"
              exit 0
            fi
            echo "  Not yet available (HTTP $STATUS), waiting 20s... (attempt $i/30)"
            sleep 20
          done
          echo "✗ Timed out waiting for PyPI to show $VERSION"
          exit 1

  # ============================================
  # JOB 2: Build Linux installers (waits for PyPI)
  # ============================================
  build-linux:
    needs: publish-pypi
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [cpu, gpu]
    env:
      VERSION: ${{ needs.publish-pypi.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Check release version matches source
        run: |
          SRC="$(sed -n 's/^__version__ *= *"\(.*\)".*/\1/p' src/matchypatchy/__init__.py)"
          if [ "$SRC" != "$VERSION" ]; then
            echo "::error::__version__ ($SRC) does not match the release ($VERSION)"
            exit 1
          fi

      - name: Free disk space
        run: |
          # The GPU environment is several GB; make room on the runner
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Build .deb and tarball (${{ matrix.variant }})
        run: bash installation/linux/build.sh ${{ matrix.variant }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # JOB 3: Build Windows installers (waits for PyPI)
  # ============================================
  build-windows:
    needs: publish-pypi
    runs-on: windows-latest
    strategy:
      matrix:
        variant: [cpu, gpu]
    env:
      VERSION: ${{ needs.publish-pypi.outputs.version }}
      PYTHON_VERSION: "3.12.10"
    steps:
      - uses: actions/checkout@v6

      - name: Check requirements pin matches the release (${{ matrix.variant }})
        shell: powershell
        run: |
          $pin = (Select-String -Path "requirements-${{ matrix.variant }}.txt" -Pattern '^matchypatchy==(\S+)').Matches[0].Groups[1].Value
          if ($pin -ne $env:VERSION) {
            throw "requirements-${{ matrix.variant }}.txt pins matchypatchy==$pin but the release is $env:VERSION"
          }

      - name: Install NSIS
        run: choco install nsis -y

      - name: Prepare installer files (${{ matrix.variant }})
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Path "build" -Force | Out-Null

          # Official embeddable Python (relocatable) + pip bootstrap
          Invoke-WebRequest "https://www.python.org/ftp/python/${env:PYTHON_VERSION}/python-${env:PYTHON_VERSION}-embed-amd64.zip" -OutFile "python-embed.zip"
          Expand-Archive -Path "python-embed.zip" -DestinationPath "build\python_env"
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile "build\get-pip.py"

          # Installer inputs
          Copy-Item "requirements-${{ matrix.variant }}.txt" "build\requirements.txt"
          Copy-Item "installation\windows\MatchyPatchy.nsi" "build\"
          Copy-Item "installation\windows\launcher.vbs" "build\"
          Copy-Item "installation\windows\matchypatchy.ico" "build\"
          Copy-Item "installation\windows\python._pth" "build\"

      - name: Build NSIS installer (${{ matrix.variant }})
        shell: cmd
        run: |
          cd build
          "C:\Program Files (x86)\NSIS\makensis.exe" /DVARIANT=${{ matrix.variant }} /DAPP_VERSION=%VERSION% MatchyPatchy.nsi

      - name: Move installer to dist (${{ matrix.variant }})
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Copy-Item -Path "build\MatchyPatchy-v$env:VERSION-${{ matrix.variant }}-setup.exe" -Destination "dist\" -Force

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/MatchyPatchy-v*-*-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # JOB 3: Build MacOS installers (waits for PyPI)
  # ============================================
  build-macos:
    strategy:
      matrix:
        include:
          - { os: macos-14,       arch: arm64 }
          - { os: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m pip install uv
      - name: Check version
        run: |
          SRC="$(sed -n 's/^__version__ *= *"\(.*\)".*/\1/p' src/matchypatchy/__init__.py)"
          [ "$SRC" = "$VERSION" ] || { echo "::error::__version__ ($SRC) does not match $VERSION"; exit 1; }
      - run: bash installation/macos/build.sh
        env:
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
      - uses: softprops/action-gh-release@v1
        with: { files: dist/*.dmg }