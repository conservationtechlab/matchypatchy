name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ============================================
  # JOB 1: Publish to PyPI (runs first)
  # ============================================
  publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi  # Should match the environment name you set in PyPI's trusted publisher config (if any)
    permissions:
      id-token: write  # Required for PyPI trusted publishing (OIDC)
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            echo "Not triggered by a version tag (ref: $GITHUB_REF) — reading version from pyproject.toml instead."
            VERSION=$(grep '^version' pyproject.toml | head -1 | sed -E 's/version *= *"([^"]+)"/\1/')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if version already exists on PyPI
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/matchypatchy/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists on PyPI — will skip build/upload."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION not found on PyPI — will build and publish."
          fi

      - name: Install build tools
        if: steps.check.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution
        if: steps.check.outputs.exists != 'true'
        run: python -m build

      - name: Check distribution
        if: steps.check.outputs.exists != 'true'
        run: twine check dist/*

      - name: Publish to PyPI
        if: steps.check.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password/token needed — uses OIDC trusted publishing

      - name: Wait for PyPI index to update
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Waiting for matchypatchy==$VERSION to become available on PyPI..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Cache-Control: no-cache" \
              "https://pypi.org/pypi/matchypatchy/$VERSION/json")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Version $VERSION is live on PyPI"
              exit 0
            fi
            echo "  Not yet available (HTTP $STATUS), waiting 20s... (attempt $i/30)"
            sleep 20
          done
          echo "✗ Timed out waiting for PyPI to show $VERSION"
          exit 1

  # ============================================
  # JOB 2: Build Linux installers (waits for PyPI)
  # ============================================
  build-linux:
    needs: publish-pypi
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.variant }}-${{ hashFiles(format('requirements-{0}.txt', matrix.variant)) }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.variant }}-

      - name: Build bundled Python environment (${{ matrix.variant }})
        env:
          VERSION: ${{ needs.publish-pypi.outputs.version }}
        run: |
          echo "Creating Python virtual environment for ${{ matrix.variant }}..."
          python3 -m venv python_env
          source python_env/bin/activate

          pip install --upgrade pip setuptools wheel

          echo "Installing packages from requirements-${{ matrix.variant }}.txt without dependencies..."
          pip install --no-deps -r requirements-${{ matrix.variant }}.txt

          echo "Verifying matchypatchy==$VERSION was pulled from PyPI..."
          pip show matchypatchy

      - name: Create installer directory structure (${{ matrix.variant }})
        run: |
          mkdir -p build/opt/matchypatchy
          mkdir -p build/usr/local/bin
          mkdir -p build/usr/share/applications

          cp -r python_env build/opt/matchypatchy/python_env
          cp installation/linux/opt/matchypatchy/install.sh build/opt/matchypatchy/
          cp installation/linux/opt/matchypatchy/launcher.sh build/opt/matchypatchy/
          cp installation/linux/opt/matchypatchy/uninstall.sh build/opt/matchypatchy/
          chmod +x build/opt/matchypatchy/*.sh

          cp installation/linux/usr/local/bin/matchypatchy build/usr/local/bin/
          chmod +x build/usr/local/bin/matchypatchy
          cp installation/linux/usr/share/applications/matchypatchy.desktop build/usr/share/applications/

      - name: Update version in install script (${{ matrix.variant }})
        env:
          VERSION: ${{ needs.publish-pypi.outputs.version }}
        run: |
          sed -i "s/VERSION=\".*\"/VERSION=\"$VERSION\"/g" build/opt/matchypatchy/install.sh

      - name: Create tarball (${{ matrix.variant }})
        env:
          VERSION: ${{ needs.publish-pypi.outputs.version }}
        run: |
          mkdir -p dist
          cd build
          tar -czf "../dist/matchypatchy-${VERSION}-linux-${{ matrix.variant }}-x86_64.tar.gz" .
          cd ..

      - name: Create .deb package (${{ matrix.variant }})
        env:
          VERSION: ${{ needs.publish-pypi.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p build/DEBIAN

          {
            printf 'Package: matchypatchy\n'
            printf 'Version: %s\n' "$VERSION"
            printf 'Section: utils\n'
            printf 'Priority: optional\n'
            printf 'Architecture: amd64\n'
            printf 'Maintainer: Conservation Technology Lab <info@example.com>\n'
            printf 'Depends: bash\n'
            printf 'Description: MatchyPatchy - Image matching application\n'
            printf ' MatchyPatchy with bundled Python runtime.\n'
          } > build/DEBIAN/control

          {
            printf '#!/bin/bash\n'
            printf 'set -e\n'
            printf 'chmod +x /opt/matchypatchy/install.sh\n'
            printf 'chmod +x /opt/matchypatchy/launcher.sh\n'
            printf 'chmod +x /opt/matchypatchy/uninstall.sh\n'
            printf 'chmod +x /usr/local/bin/matchypatchy\n'
            printf '/opt/matchypatchy/install.sh\n'
          } > build/DEBIAN/postinst
          chmod +x build/DEBIAN/postinst

          dpkg-deb --build build "dist/matchypatchy-${VERSION}-linux-${VARIANT}_amd64.deb" 2>/dev/null && \
            echo "✓ .deb package created" || \
            echo "Note: dpkg not available, skipping .deb creation"

      - name: Clean up for next variant
        run: rm -rf build python_env

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # JOB 3: Build Windows installers (waits for PyPI)
  # ============================================
  build-windows:
    needs: publish-pypi
    runs-on: windows-latest
    strategy:
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install NSIS
        run: choco install nsis -y

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ matrix.variant }}-${{ hashFiles(format('requirements-{0}.txt', matrix.variant)) }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.variant }}-

      - name: Build bundled Python environment (${{ matrix.variant }})
        shell: powershell
        run: |
          python -m venv python_env
          .\python_env\Scripts\Activate.ps1
          pip install --upgrade pip setuptools wheel
          pip install --no-deps -r requirements-${{ matrix.variant }}.txt
          pip show matchypatchy

      - name: Create installer directory structure (${{ matrix.variant }})
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "build\installation\windows" -Force | Out-Null
          Copy-Item -Path "python_env" -Destination "build\installation\windows\python_env" -Recurse -Force
          Remove-Item -Path "python_env" -Recurse -Force
          Copy-Item -Path "installation\windows\launcher.vbs" -Destination "build\installation\windows\" -Force
          Copy-Item -Path "installation\windows\MatchyPatchy-${{ matrix.variant }}.nsi" -Destination "build\installation\windows\" -Force

      - name: Update version in NSIS script (${{ matrix.variant }})
        shell: powershell
        env:
          VERSION: ${{ needs.publish-pypi.outputs.version }}
        run: |
          $nsiPath = "build\installation\windows\MatchyPatchy-${{ matrix.variant }}.nsi"
          (Get-Content $nsiPath) -replace '!define APP_VERSION ".*"', "!define APP_VERSION ""$env:VERSION""" | Set-Content $nsiPath
          (Get-Content $nsiPath) -replace 'OutFile "MatchyPatchy-v.*-.*-setup\.exe"', "OutFile ""MatchyPatchy-v$env:VERSION-${{ matrix.variant }}-setup.exe""" | Set-Content $nsiPath

      - name: Build NSIS installer (${{ matrix.variant }})
        shell: cmd
        run: |
          cd build\installation\windows
          "C:\Program Files (x86)\NSIS\makensis.exe" MatchyPatchy-${{ matrix.variant }}.nsi

      - name: Move installer to dist (${{ matrix.variant }})
        shell: powershell
        env:
          VERSION: ${{ needs.publish-pypi.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Copy-Item -Path "build\installation\windows\MatchyPatchy-v$env:VERSION-${{ matrix.variant }}-setup.exe" -Destination "dist\" -Force

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/MatchyPatchy-v*-*-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}