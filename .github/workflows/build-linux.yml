name: Build Linux Installer

on:
  push:
    tags:
      - 'v*'  # Only build on version tags (v0.2.0, etc)
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Build installer (with --no-deps)
        run: bash build.sh
        env:
          # Optional: Set this to control pip index
          PIP_INDEX_URL: https://pypi.org/simple/
      
      - name: Verify package integrity
        run: |
          cd build/opt/matchypatchy
          ./python_env/bin/pip list --format=json > /tmp/installed.json
          echo "=== Installed Packages ==="
          cat /tmp/installed.json
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: false
          prerelease: false
          body: |
            # MatchyPatchy Linux Installer
            
            Download and install:
            ```bash
            tar -xzf matchypatchy-*.tar.gz
            cd opt/matchypatchy
            ./install.sh
            ```
            
            Or install via apt:
            ```bash
            sudo apt install ./matchypatchy-*.deb
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts (non-release builds)
        if: '!startsWith(github.ref, ''refs/tags/'')'
        uses: actions/upload-artifact@v3
        with:
          name: matchypatchy-linux-builds
          path: dist/
          retention-days: 30