name: Bump Version and Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install bump2version
        run: pip install bump2version
      
      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Get current version
        id: current
        run: |
          VERSION=$(grep '__version__' src/matchypatchy/__init__.py | grep -oP '\d+\.\d+\.\d+')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
      
      - name: Bump version (${{ github.event.inputs.bump_type }})
        id: bump
        run: |
          bump2version ${{ github.event.inputs.bump_type }} \
            --config-file .bumpversion.cfg \
            --verbose
          
          NEW_VERSION=$(grep '__version__' src/matchypatchy/__init__.py | grep -oP '\d+\.\d+\.\d+')
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
      
      - name: Push changes and tag
        run: |
          git push origin main
          git push origin --tags
      
      - name: Create Pull Request (optional)
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore: bump version to ${{ steps.bump.outputs.new_version }}'
          title: 'chore: bump version to ${{ steps.bump.outputs.new_version }}'
          body: |
            Automatic version bump from ${{ steps.current.outputs.version }} to ${{ steps.bump.outputs.new_version }}
            
            Bump type: `${{ github.event.inputs.bump_type }}`
            
            This will trigger PyPI publishing when merged.
          branch: version-bump-${{ steps.bump.outputs.new_version }}
          delete-branch: true