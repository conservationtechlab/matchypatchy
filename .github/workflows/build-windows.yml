name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v0.2.0, v0.2.1, etc)
  workflow_dispatch:  # Manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep 'version = ' pyproject.toml | head -1 | grep -oP '\d+\.\d+\.\d+')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"
      
      - name: Install NSIS
        run: choco install nsis -y
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Build bundled Python environment
        shell: powershell
        run: |
          Write-Host "Creating Python virtual environment..."
          python -m venv python_env
          
          Write-Host "Activating venv..."
          .\python_env\Scripts\Activate.ps1
          
          Write-Host "Upgrading pip..."
          pip install --upgrade pip setuptools wheel
          
          Write-Host "Installing packages without dependencies..."
          pip install --no-deps -r requirements.txt
          
          Write-Host "Verifying installation..."
          pip list
      
      - name: Create installer directory structure
        shell: powershell
        run: |
          Write-Host "Creating build directory structure..."
          New-Item -ItemType Directory -Path "build\installation\windows" -Force | Out-Null
          New-Item -ItemType Directory -Path "build\installation\windows\python_env" -Force | Out-Null
          
          Write-Host "Copying Python environment..."
          Copy-Item -Path "python_env\*" -Destination "build\installation\windows\python_env\" -Recurse -Force
          
          Write-Host "Copying launcher..."
          Copy-Item -Path "installation\windows\launcher.vbs" -Destination "build\installation\windows\" -Force
          
          Write-Host "Copying NSIS script..."
          Copy-Item -Path "installation\windows\MatchyPatchy.nsi" -Destination "build\installation\windows\" -Force
      
      - name: Update version in NSIS script
        shell: powershell
        run: |
          $nsiPath = "build\installation\windows\MatchyPatchy.nsi"
          $version = "${{ steps.version.outputs.version }}"
          
          Write-Host "Updating NSIS version to $version..."
          
          (Get-Content $nsiPath) -replace '!define APP_VERSION ".*"', "!define APP_VERSION ""$version""" | Set-Content $nsiPath
          (Get-Content $nsiPath) -replace 'OutFile "MatchyPatchy-v.*-CPU-Setup\.exe"', "OutFile ""MatchyPatchy-v$version-CPU-Setup.exe""" | Set-Content $nsiPath
      
      - name: Build NSIS installer
        shell: cmd
        run: |
          cd build\installation\windows
          "C:\Program Files (x86)\NSIS\makensis.exe" MatchyPatchy.nsi
          cd ..\..\..
      
      - name: Verify installer was created
        shell: powershell
        run: |
          $installerPath = "build\installation\windows\MatchyPatchy-v${{ steps.version.outputs.version }}-CPU-Setup.exe"
          if (Test-Path $installerPath) {
            $size = (Get-Item $installerPath).Length / 1MB
            Write-Host "✓ Installer created: $(Split-Path $installerPath -Leaf) ($([Math]::Round($size, 2)) MB)"
          } else {
            Write-Host "✗ Installer not found!"
            exit 1
          }
      
      - name: Create release directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Copy-Item -Path "build\installation\windows\MatchyPatchy-v${{ steps.version.outputs.version }}-CPU-Setup.exe" -Destination "dist\" -Force
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/MatchyPatchy-v*-CPU-Setup.exe
          body: |
            # MatchyPatchy v${{ steps.version.outputs.version }} - Windows Installer
            
            Download and run: `MatchyPatchy-v${{ steps.version.outputs.version }}-CPU-Setup.exe`
            
            The installer will:
            - Create a Python virtual environment
            - Install all dependencies
            - Create desktop and Start Menu shortcuts
            - Allow you to launch the app immediately after installation
            
            **System Requirements:**
            - Windows 10 or later
            - ~2 GB disk space (for Python + dependencies)
            - No admin privileges required
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts (manual/test builds)
        if: '!startsWith(github.ref, ''refs/tags/'')'
        uses: actions/upload-artifact@v3
        with:
          name: matchypatchy-windows-installer
          path: dist/
          retention-days: 7