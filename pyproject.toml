[project]
name = "matchypatchy"
dynamic = ["version"]
authors = [
  { name="Kyra Swanson", email="tswanson@sdzwa.org" },
]
description = "GUI tool for human validation of AI-powered animal re-identification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "animl-lite==3.4.0",
    "chromadb>=1.3.4",
    "pyqt6>=6.9.0",
]

[project.optional-dependencies]
gpu = [
    # CUDA 12 / cuDNN 9 libraries required by onnxruntime-gpu 1.22
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cuda-nvrtc-cu12==12.9.86",
    "nvidia-cuda-runtime-cu12==12.9.79",
    "nvidia-cudnn-cu12==9.26.0.51",
    "nvidia-cufft-cu12==11.4.1.4",
    "nvidia-curand-cu12==10.3.10.19",
]

[project.urls]
Homepage = "https://github.com/onservationtechlab/matchypatchy"
Issues = "https://github.com/onservationtechlab/matchypatchy/issues"

[build-system]
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "matchypatchy.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matchypatchy = ["assets/**/*", "assets/graphics/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.pylint.master]
extension-pkg-whitelist = ["PyQt6"]

[tool.pylint.messages_control]
disable = ["no-name-in-module"]